site_name: Veloce
site_description: >-
  Ultra-fast async Python web framework — ASGI-native, batteries included.
site_url: https://veloceframework.com/
site_author: Veloce maintainers
copyright: Copyright &copy; 2026 Veloce maintainers

repo_url: https://github.com/Lokesh-Tallapaneni/veloce
repo_name: Lokesh-Tallapaneni/veloce
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/veloce-logo.svg
  favicon: assets/veloce-mark.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lokesh-Tallapaneni/veloce
      name: Veloce on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/veloce/
      name: Veloce on PyPI

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Routing: guide/routing.md
      - Requests & Responses: guide/requests-responses.md
      - Dependency Injection: guide/dependency-injection.md
      - Middleware: guide/middleware.md
      - WebSockets: guide/websockets.md
      - Testing: guide/testing.md
      - Deployment: guide/deployment.md
  - API Reference: reference.md
  - Changelog: changelog.md
