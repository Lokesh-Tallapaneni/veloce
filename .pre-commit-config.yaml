# See https://pre-commit.com for hook docs.
# Install: pre-commit install   |   Run on all files: pre-commit run --all-files
# Bump pinned versions with: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbid-catch-all-tests
        name: forbid catch-all / iteration-named test files
        entry: >-
          bash -c 'bad=$(ls tests/ | grep -E "^test_(iteration[0-9]+|new_features|final_coverage|misc_e2e|reliability_fixes|vel[0-9]*_|reported_bugs|issues|bugs|fixes)\.py$" || true); if [ -n "$bad" ]; then echo "Catch-all test files are forbidden; place each test in test_<feature>.py. Offending: $bad"; exit 1; fi'
        language: system
        pass_filenames: false
        files: ^tests/
