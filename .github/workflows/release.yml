name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Gate the tag on the same full matrix that gates a merge (3.10-3.13 +
  # Windows + no-msgspec + fuzz + coverage), not a single-interpreter run, so
  # a tag cannot ship an artifact broken on an interpreter/OS the matrix covers.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist + wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Check artifacts
        run: |
          ls -la dist/
          uv tool run --from twine twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/veloceframework/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Literal substring match (no dynamically-built regex) so extraction
          # is awk-implementation-independent: mawk and gawk treat escaped
          # brackets in a string-built regex differently.
          awk -v tag="[$version]" '
            /^## \[/ {
              if (found) exit
              if (index($0, tag)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Wrote release notes for $version:"
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
