name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Reading a pull request's state, to check the links the release notes carry.
  pull-requests: read

jobs:
  # Gate the tag on the same full matrix that gates a merge (3.10-3.13 +
  # Windows + no-msgspec + fuzz + coverage), not a single-interpreter run, so
  # a tag cannot ship an artifact broken on an interpreter/OS the matrix covers.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    timeout-minutes: 20
    name: Build sdist + wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      # Every PR the notes link must be merged. The entries are written before
      # the pull request exists, so its number is a guess, and a guess that
      # lands on somebody else's PR is invisible: the link resolves, it just
      # goes somewhere unrelated. 0.18.0 shipped 295 entries pointing at an
      # open dependency bump this way. Checked here rather than in the release
      # job because that one runs after the PyPI upload, and an artifact cannot
      # be unpublished.
      - name: Check the release notes' PR links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="[$version]" '
            /^## \[/ {
              if (found) exit
              if (index($0, tag)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no [$version] section to release"
            exit 1
          fi
          status=0
          for pr in $(grep -oE 'pull/[0-9]+' release-notes.md | cut -d/ -f2 | sort -nu); do
            state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$state" != "MERGED" ]; then
              echo "::error::CHANGELOG [$version] links pull/$pr, which is $state - expected MERGED"
              status=1
            fi
          done
          exit $status

      - name: Build
        run: uv build
      - name: Check artifacts
        run: |
          ls -la dist/
          uv tool run --from twine twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    timeout-minutes: 20
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/veloceframework/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    timeout-minutes: 20
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Literal substring match (no dynamically-built regex) so extraction
          # is awk-implementation-independent: mawk and gawk treat escaped
          # brackets in a string-built regex differently.
          awk -v tag="[$version]" '
            /^## \[/ {
              if (found) exit
              if (index($0, tag)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Wrote release notes for $version:"
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
