name: CI

on:
  push:
  pull_request:
  # Lets the release workflow gate a tag on this exact matrix.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src/veloce

      - name: Test
        run: uv run pytest -q --cov=veloce --cov-report=term-missing --cov-fail-under=90

  windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The native dev server (Veloce.run) has Windows-specific paths — the
      # stdlib-asyncio fallback (uvloop is excluded on win32), signal
      # handling, and socket-option guards — that the ubuntu matrix never
      # executes. Coverage is enforced by the ubuntu legs; this leg gates on
      # the tests alone.
      - name: Test
        run: uv run pytest -q

  no-msgspec:
    name: test without msgspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip uninstall msgspec

      # The msgspec-guarded tests skip and the Pydantic-only paths must stay
      # green, so a change that imports msgspec unconditionally fails here.
      - name: Test
        run: uv run pytest -q

  fuzz:
    name: parser fuzzing (hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The fuzz group also runs in the default suite above; this leg runs it
      # in isolation with a larger example budget so a parser regression
      # surfaces here even when the per-example default keeps the main run fast.
      - name: Fuzz parsers
        run: uv run pytest -m fuzz -q
        env:
          HYPOTHESIS_PROFILE: ci

  test-layout:
    name: test file layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catch-all / iteration-named test files are forbidden; each test
      # belongs in test_<feature>.py. Enforce the rule structurally so it
      # cannot drift back in.
      - name: Forbid catch-all test files
        run: |
          bad=$(ls tests/ | grep -E '^test_(iteration[0-9]+|new_features|final_coverage|misc_e2e|reliability_fixes|vel[0-9]*_|reported_bugs|issues|bugs|fixes)\.py$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Catch-all / iteration-named test files are forbidden; place each test in test_<feature>.py. Offending: $bad"
            exit 1
          fi
