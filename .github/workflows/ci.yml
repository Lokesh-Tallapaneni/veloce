name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src/veloce

      - name: Test
        run: uv run pytest -q --cov=veloce --cov-report=term-missing --cov-fail-under=90

  fuzz:
    name: parser fuzzing (hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The fuzz group also runs in the default suite above; this leg runs it
      # in isolation with a larger example budget so a parser regression
      # surfaces here even when the per-example default keeps the main run fast.
      - name: Fuzz parsers
        run: uv run pytest -m fuzz -q
        env:
          HYPOTHESIS_PROFILE: ci

  bench:
    name: dispatch micro-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Surfaces dispatch throughput in the CI log on every push, and
      # fails the build on a catastrophic (multi-x) regression via a
      # deliberately loose floor — runner variance stays well above it.
      # A finer baseline-relative gate is tracked separately.
      - name: Benchmark
        run: uv run python bench/dispatch_bench.py --min-rps 2000
