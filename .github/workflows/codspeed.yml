name: CodSpeed

on:
  # Establishes the performance baseline every PR is compared against. No paths
  # filter: a commit that lands on main without one leaves no baseline, and
  # CodSpeed then silently falls back to an older commit - which was measured on
  # a different runner, so the comparison carries that machine's speed as if it
  # were a code delta. A docs-only merge did exactly that, and the next PR was
  # compared against a baseline two commits back.
  push:
    branches: [main]
  # Required for CodSpeed to report the delta on a pull request.
  pull_request:
    # A docs-only or test-only change cannot move a benchmark, and a run that
    # measures nothing still costs several minutes of CI and adds a comparison
    # against a baseline that did not move.
    paths:
      - "src/veloce/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
  # Lets CodSpeed trigger a backtest run to seed historical data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # OpenID Connect authentication with CodSpeed - no token secret needed.
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    # A hung benchmark should fail the job, not occupy a runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"

      # The benchmarks import the optional backends the framework ships
      # (msgspec, uvicorn, redis), so the environment matches the CI test legs.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Instruction counting: deterministic, no noise floor, so a small
      # regression is visible. It cannot see system calls, which is why the
      # thread-crossing benchmarks are excluded here and measured below.
      - name: Run benchmarks (CPU simulation)
        uses: CodSpeedHQ/action@f1d600dbe5eb1d03277a466f331e5f19f64fc567 # v5
        with:
          mode: simulation
          # `benchmarks/` sits outside `testpaths`, so it is only ever
          # collected when named explicitly - as here.
          run: >-
            uv run pytest benchmarks
            --ignore=benchmarks/walltime --ignore=benchmarks/memory --codspeed


      # Allocation rather than speed: the compiled route table, a deep
      # dependency graph, and the per-connection objects a server holds for as
      # long as a client stays connected. A `__slots__` entry lost in a refactor
      # restores the per-instance dict and shows up here as a step change,
      # while both timing instruments stay flat.
      - name: Run benchmarks (memory)
        uses: CodSpeedHQ/action@f1d600dbe5eb1d03277a466f331e5f19f64fc567 # v5
        with:
          mode: memory
          run: uv run pytest benchmarks/memory --codspeed

  # Wall time measures what the other two instruments cannot: a sync handler and
  # offloaded compression spend most of their cost in a thread hop, which
  # instruction counting excludes and allocation counting never sees.
  #
  # It runs in its own non-gating job because GitHub's hosted pool is
  # heterogeneous: every wall-clock figure this repo has recorded falls into one
  # of two clusters roughly 1.4-1.9x apart, so a run whose head lands on the slow
  # class and whose base landed on the fast one reports that hardware ratio as a
  # code regression. One did: nine of nine wall-time benchmarks "regressed" up to
  # 48% while all fifty-six simulation and memory benchmarks reported no movement
  # at all, on a commit whose only change was to a function those benchmarks
  # never call. A change cannot partition along instrument boundaries; a machine
  # can.
  #
  # Widening the threshold is not the alternative - the machine ratio is 40-90%,
  # so any band wide enough to absorb it would also absorb every regression worth
  # catching. The trend still lands on the CodSpeed dashboard, where a step
  # change is distinguishable from a hardware draw by eye. Moving this job to a
  # CodSpeed macro runner would make the numbers gate-worthy again.
  walltime:
    name: Run benchmarks (wall time)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run benchmarks (wall time)
        uses: CodSpeedHQ/action@f1d600dbe5eb1d03277a466f331e5f19f64fc567 # v5
        with:
          mode: walltime
          run: uv run pytest benchmarks/walltime --codspeed
