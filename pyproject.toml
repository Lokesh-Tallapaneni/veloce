[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veloceframework"
version = "0.17.1"
description = "Ultra-fast async Python web framework — ASGI-native, batteries included"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lokesh Tallapaneni" },
]
maintainers = [
    { name = "Lokesh Tallapaneni" },
]
keywords = [
    # What it is
    "veloce",
    "asgi",
    "async",
    "asyncio",
    "web",
    "framework",
    "web-framework",
    "http",
    "http-server",
    # What it is used to build
    "api",
    "rest",
    "rest-api",
    "microservice",
    "websocket",
    "sse",
    "server-sent-events",
    # What it documents itself with
    "openapi",
    "swagger",
    "redoc",
    # The MCP server, which is the thing no comparable framework ships
    "mcp",
    "model-context-protocol",
    "llm",
    "ai-agents",
    "agents",
    "tools",
    # How handlers are written
    "dependency-injection",
    "pydantic",
    "msgspec",
    "type-hints",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "orjson>=3.11.5",
    "pydantic>=2.4.0",
    "multidict>=6.0.0",
    "python-multipart>=0.0.22",
    "httptools>=0.6.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
# uvicorn is the recommended production ASGI server and what `veloce run` hands
# the app to. It is optional because veloce does NOT need it to serve: the
# built-in `app.run()` server (and the gunicorn `VeloceWorker`) run the app
# directly, and `veloce run` falls back to the built-in server when uvicorn is
# absent (its `--reload` then needs this extra). Install with
# `pip install veloceframework[uvicorn]` to deploy under `uvicorn your:app`.
uvicorn = ["uvicorn[standard]>=0.23"]
# Veloce's built-in server implements the WebSocket protocol itself, so it needs
# nothing extra. This extra provides the `websockets` library for deploying as an
# ASGI app under a server that relies on it for WebSocket framing - e.g. plain
# `uvicorn` (the `[uvicorn]` extra's `uvicorn[standard]` already bundles it).
# Install with `pip install veloceframework[ws]`.
ws = ["websockets>=12"]
# gunicorn process supervision for the optional `veloce.workers.VeloceWorker`
# worker class. POSIX-only — gunicorn does not run on Windows — so this extra
# is opt-in and never pulled in by a plain install. The `uvicorn` extra
# remains the recommended production server.
gunicorn = ["gunicorn>=23.0.0; sys_platform != 'win32'"]
# OpenTelemetry tracing bridge for `veloce.otel.instrument_with_otel`. Only the
# OTel API is pulled in — the application supplies its own configured SDK,
# TracerProvider, and exporter. Kept optional so a plain install carries no
# tracing dependency. Install with `pip install veloceframework[otel]`.
otel = ["opentelemetry-api>=1.20"]
# Prometheus metrics exporter for `veloce.metrics.instrument_with_prometheus`.
# Pulls in `prometheus_client`; the application owns serving `/metrics`. Kept
# optional so a plain install carries no metrics dependency. Install with
# `pip install veloceframework[metrics]`.
metrics = ["prometheus_client>=0.17"]
# msgspec as an opt-in fast validation / serialization backend alongside
# Pydantic: a handler may type a body param or response as a `msgspec.Struct`
# and it decodes / encodes in C. Pydantic stays the default and is always
# required; without this extra every msgspec code path is inert. The `>=0.13`
# floor is set by `msgspec.to_builtins`. Install with
# `pip install veloceframework[fast]`.
fast = ["msgspec>=0.13"]
# Redis-backed session store, rate-limit backend, and cache for
# `veloce.contrib.redis` (`RedisSessionStore`, `RedisRateLimitBackend`,
# `RedisCache`) - shared state across workers. Kept optional so a single-process
# / in-memory deploy carries no redis dependency.
# Install with `pip install veloceframework[redis]`.
redis = ["redis>=4.2"]
# Click is needed only for Flask-style per-app commands via `app.cli`
# (`@app.cli.command()`) and `app.test_cli_runner()`. The built-in `veloce` CLI
# is pure stdlib `argparse` and needs nothing extra, so Click stays opt-in.
# Install with `pip install veloceframework[cli]`.
cli = ["click>=8.1"]
# Brotli for `CompressionMiddleware`. Every current browser sends `br` in
# Accept-Encoding, and it compresses text better than gzip at comparable speed
# around the quality the middleware defaults to. Without this extra the
# middleware simply does not offer `br`. Install with
# `pip install veloceframework[brotli]`.
brotli = ["brotli>=1.0"]
# Zstandard for `CompressionMiddleware`. Faster than both gzip and brotli at a
# similar ratio, and increasingly sent by browsers as `zstd`. Without this extra
# the middleware does not offer `zstd`. Install with
# `pip install veloceframework[zstd]`.
zstd = ["zstandard>=0.21"]
# ciso8601 accelerates the `<datetime:>` path converter. Only values with no
# numeric offset take it - those are the ones it parses identically to the
# stdlib - so the converter answers the same either way, just faster. Install
# with `pip install veloceframework[ciso8601]`.
ciso8601 = ["ciso8601>=2.3"]
# Everything optional in one shot.
all = [
    "uvicorn[standard]>=0.23",
    "websockets>=12",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "opentelemetry-api>=1.20",
    "prometheus_client>=0.17",
    "msgspec>=0.13",
    "redis>=4.2",
    "click>=8.1",
    "brotli>=1.0",
    "zstandard>=0.21",
    "ciso8601>=2.3",
]

[project.scripts]
veloce = "veloce.cli:main"

[project.urls]
Homepage = "https://github.com/Lokesh-Tallapaneni/veloce"
Documentation = "https://veloceframework.com"
Source = "https://github.com/Lokesh-Tallapaneni/veloce"
Issues = "https://github.com/Lokesh-Tallapaneni/veloce/issues"
Changelog = "https://github.com/Lokesh-Tallapaneni/veloce/blob/main/CHANGELOG.md"

[dependency-groups]
# Runtime deps (jinja2) are in [project.dependencies]; the dev group covers
# test + lint + type-check tooling, plus the optional backends the suite
# exercises (uvicorn for the `veloce run` / serving tests, msgspec for the fast
# path, click for the `app.cli` tests).
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # uvicorn is now an optional extra, but the test suite still exercises the
    # `veloce run` / serving paths, so the dev environment installs it.
    "uvicorn[standard]>=0.23",
    # The `cli` extra's backend, so the default test run exercises the Flask-style
    # `app.cli` / `test_cli_runner` paths; the guarded tests skip without it.
    "click>=8.1",
    # The `fast` extra's backend, so the default test run exercises the msgspec
    # path; the no-msgspec CI leg installs without it and the guarded tests skip.
    "msgspec>=0.13",
    # In-memory Redis fake so the contrib.redis store/limiter tests run without a
    # real Redis server.
    "fakeredis>=2.20",
    # `fakeredis` executes Lua only with a runtime available; without it the
    # Lua/Python rate-limit parity guard would skip and the duplication of each
    # built-in strategy would be unchecked.
    "lupa>=2.0",
    # CodSpeed's pytest plugin — powers the `benchmarks/` suite (`pytest
    # benchmarks --codspeed`) that CI runs to track request-path performance.
    "pytest-codspeed>=5.0.3",
    # The libraries `docs/guide/databases.md` and `docs/how-to/graphql.md` are
    # written against. Their examples had never been executed because these were
    # not installed, and the GraphQL page's install line was wrong as a result.
    # The guarded tests skip without them; installing them is what makes the
    # guard run.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "strawberry-graphql[asgi]>=0.230",
    "brotli>=1.2.0",
    "zstandard>=0.25.0",
    "ciso8601>=2.3.3",
]
docs = [
    "mkdocs-material[imaging]>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veloce"]

[tool.hatch.build.targets.sdist]
# Ship the source tree, tests, and release metadata. Internal bench
# harnesses, the docs build, and CI plumbing stay in the repo but
# do not get redistributed to PyPI consumers.
include = [
    "src/veloce",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Tests marked `perf` time wall-clock behaviour. They are excluded from
# the default run because OS-scheduler jitter under full-suite CPU
# contention makes them flaky even with a generous relative budget.
# Run them explicitly with `pytest -m perf` on a quiet machine.
addopts = ["-m", "not perf"]
markers = [
    "perf: timing/perf check — opt-in via `pytest -m perf`, off by default",
    "fuzz: property-based parser fuzz test — run as a group with `pytest -m fuzz`",
]

[tool.coverage.run]
source = ["veloce"]
branch = true

[tool.coverage.report]
# The 90% floor is enforced by CI via `pytest --cov-fail-under=90` (single source
# of truth) - branch coverage currently sits ~92%, leaving headroom for small
# dips without flaking. These exclusions keep the measured base honest.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ASYNC",
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (Depends/Query/etc. legitimately need this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]  # bugbear false positives in test patterns
"src/veloce/__init__.py" = ["F401"]  # re-exports

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["veloce"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = ["build", "dist", "tests"]
# Strict checks relaxed repo-wide because they conflict with deliberate design
# choices, not because the code is wrong: leaf modules re-export internal
# constants (the gateway-`__all__` convention) and the package subclasses /
# calls untyped third-party bases (the gunicorn worker, the redis client).
no_implicit_reexport = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "uvloop",
    "httptools",
    "multipart.*",
    "gunicorn.*",
    "opentelemetry.*",
    "prometheus_client",
    "redis.*",
    "watchfiles",
    "brotli",
    "brotlicffi",
    "zstandard",
    "ciso8601",
]
ignore_missing_imports = true

# Incremental strict burn-down: these modules still use bare generics
# (`Callable`/`dict`/`list` without type parameters), return `Any`, or carry an
# untyped def. strict applies to every other module and all new code; remove a
# module from this list once it type-checks clean under the strict defaults.
[[tool.mypy.overrides]]
module = [
    "veloce._handler_plan",
    "veloce._pipeline",
    "veloce._resolver_codegen",
    "veloce.app.asgi",
    "veloce.app.background",
    "veloce.app.core",
    "veloce.app.dispatch",
    "veloce.app.errors",
    "veloce.app.lifecycle",
    "veloce.app.middleware",
    "veloce.app.openapi",
    "veloce.app.templating",
    "veloce.background",
    "veloce.blueprints",
    "veloce.config",
    "veloce.contrib.mcp.completion",
    "veloce.contrib.mcp.descriptors",
    "veloce.contrib.mcp.plan_bridge",
    "veloce.contrib.mcp.prompts",
    "veloce.contrib.mcp.registry",
    "veloce.contrib.openapi",
    "veloce.contrib.redis",
    "veloce.contrib.templating",
    "veloce.dependency",
    "veloce.encoders",
    "veloce.helpers",
    "veloce.http.datastructures",
    "veloce.http.request",
    "veloce.middleware.base",
    "veloce.middleware.compression",
    "veloce.middleware.security",
    "veloce.otel",
    "veloce.routing.router",
    "veloce.security._utils",
    "veloce.serving.protocol",
    "veloce.signals",
    "veloce.testclient",
    "veloce.views",
    "veloce.websocket",
    "veloce.workers",
]
disallow_any_generics = false
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
