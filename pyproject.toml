[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veloce"
version = "0.1.0"
description = "Ultra-fast async Python web framework — ASGI-native, batteries included"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "veloce maintainers" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "orjson>=3.9.0",
    "pydantic>=2.0.0",
    "multidict>=6.0.0",
    "python-multipart>=0.0.6",
    "httptools>=0.6.0",
]

[project.scripts]
veloce = "veloce.cli:main"

[project.urls]
Homepage = "https://github.com/Lokesh-Tallapaneni/veloce"
Source = "https://github.com/Lokesh-Tallapaneni/veloce"
Issues = "https://github.com/Lokesh-Tallapaneni/veloce/issues"
Changelog = "https://github.com/Lokesh-Tallapaneni/veloce/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "uvicorn>=0.23",
    "jinja2>=3.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "click>=8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veloce"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ASYNC",
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (Depends/Query/etc. legitimately need this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]  # bugbear false positives in test patterns
"src/veloce/__init__.py" = ["F401"]  # re-exports

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["veloce"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["build", "dist", "tests"]

[[tool.mypy.overrides]]
module = ["uvloop", "httptools", "multipart.*"]
ignore_missing_imports = true
