[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veloceframework"
version = "0.3.0"
description = "Ultra-fast async Python web framework — ASGI-native, batteries included"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lokesh Tallapaneni", email = "lokeshtallapaneni@gmail.com" },
]
maintainers = [
    { name = "Lokesh Tallapaneni", email = "lokeshtallapaneni@gmail.com" },
]
keywords = ["asgi", "async", "web", "framework", "http", "api", "websocket", "openapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "orjson>=3.9.0",
    "pydantic>=2.0.0",
    "multidict>=6.0.0",
    "python-multipart>=0.0.6",
    "httptools>=0.6.0",
    "uvicorn[standard]>=0.23",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
# WebSocket apps need the `websockets` library — pull it in via
# `pip install veloceframework[ws]`. Kept optional so REST-only deploys
# do not download the WS implementation.
ws = ["websockets>=12"]
# gunicorn process supervision for the optional `veloce.workers.VeloceWorker`
# worker class. POSIX-only — gunicorn does not run on Windows — so this extra
# is opt-in and never pulled in by a plain install. uvicorn (a core dep)
# remains the recommended production server.
gunicorn = ["gunicorn>=21.0; sys_platform != 'win32'"]
# OpenTelemetry tracing bridge for `veloce.otel.instrument_with_otel`. Only the
# OTel API is pulled in — the application supplies its own configured SDK,
# TracerProvider, and exporter. Kept optional so a plain install carries no
# tracing dependency. Install with `pip install veloceframework[otel]`.
otel = ["opentelemetry-api>=1.20"]
# Everything optional in one shot.
all = [
    "websockets>=12",
    "gunicorn>=21.0; sys_platform != 'win32'",
    "opentelemetry-api>=1.20",
]

[project.scripts]
veloce = "veloce.cli:main"

[project.urls]
Homepage = "https://github.com/Lokesh-Tallapaneni/veloce"
Documentation = "https://github.com/Lokesh-Tallapaneni/veloce"
Source = "https://github.com/Lokesh-Tallapaneni/veloce"
Issues = "https://github.com/Lokesh-Tallapaneni/veloce/issues"
Changelog = "https://github.com/Lokesh-Tallapaneni/veloce/blob/main/CHANGELOG.md"

[dependency-groups]
# Runtime deps (uvicorn, jinja2, click) are now in [project.dependencies]
# so they're picked up by `pip install veloceframework` directly; the
# dev group covers only test + lint + type-check tooling.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material[imaging]>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veloce"]

[tool.hatch.build.targets.sdist]
# Ship the source tree, tests, and release metadata. Internal bench
# harnesses, the docs build, and CI plumbing stay in the repo but
# do not get redistributed to PyPI consumers.
include = [
    "src/veloce",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Tests marked `perf` time wall-clock behaviour. They are excluded from
# the default run because OS-scheduler jitter under full-suite CPU
# contention makes them flaky even with a generous relative budget.
# Run them explicitly with `pytest -m perf` on a quiet machine.
addopts = ["-m", "not perf"]
markers = [
    "perf: timing/perf check — opt-in via `pytest -m perf`, off by default",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ASYNC",
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (Depends/Query/etc. legitimately need this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]  # bugbear false positives in test patterns
"src/veloce/__init__.py" = ["F401"]  # re-exports

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["veloce"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["build", "dist", "tests"]

[[tool.mypy.overrides]]
module = ["uvloop", "httptools", "multipart.*", "gunicorn.*", "opentelemetry.*"]
ignore_missing_imports = true
